<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050a07">
  <title>Can You Hack My Heart?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <main class="terminal" id="terminal">
    <header class="titlebar">
      <span class="dot red"></span><span class="dot amber"></span><span class="dot green"></span>
      <span class="title">heart-security-system — v1.0</span>
      <span class="status" id="statusPill" data-state="locked">LOCKED</span>
    </header>

    <div class="body">
      <!-- Boot messages are typed in here by script.js -->
      <div id="output" aria-live="polite"></div>

      <!-- Password challenge -->
      <form id="authForm" class="auth" autocomplete="off" hidden>
        <label for="pw" class="prompt">password&gt;</label>
        <div class="field">
          <input id="pw" name="pw" type="password" inputmode="text" autocapitalize="off"
                 autocorrect="off" spellcheck="false" autocomplete="off" placeholder="type here…">
          <button type="button" id="toggle" class="ghost" aria-label="Show password">show</button>
        </div>
        <button type="submit" class="btn">Unlock</button>
      </form>

      <p id="feedback" class="feedback" role="status"></p>

      <!-- Success state -->
      <section id="granted" class="granted" hidden>
        <div class="access-banner">ACCESS GRANTED ✓</div>
        <p class="welcome" id="welcome"></p>

        <article class="card" id="card" tabindex="-1">
          <p class="reveal-line" id="revealLine"></p>
          <div id="message" class="message"></div>
          <img id="photo" class="photo" alt="" hidden>
        </article>

        <div class="actions">
          <button type="button" class="btn" id="secretBtn">Open secret file 🔒</button>
          <button type="button" class="ghost" id="musicBtn" hidden>♪ play music</button>
          <button type="button" class="ghost" id="restartBtn">restart</button>
        </div>

        <div id="secret" class="secret" hidden></div>
      </section>
    </div>
  </main>

  <noscript><p style="color:#7dff9b;font-family:monospace;padding:20px">This page needs JavaScript turned on.</p></noscript>
  <script src="script.js"></script>
</body>
</html>
